name: Build, Test And Deploy To S3

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: mkdir ./obj
    - run: CC=clang make mishmash 
    - run: CC=clang make testmash
    - run: ./testmash
    - run: make clean
      
  build-wasm:
    needs: [ build-test ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: mkdir ./obj
    - name: setup emscripten
      uses: slowriot/setup-emsdk@v15
    - name: make
      run: CC=emcc make
    - uses: actions/upload-artifact@v7
      with:
        name: wasmash
        path: ./index.*
        retention-days: 1

  deploy-wasm:
    needs: [ build-wasm ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wasmash
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - run: aws s3 sync ./ s3://${{ secrets.AWS_BUCKET }}