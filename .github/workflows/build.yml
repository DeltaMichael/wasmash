name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - run: mkdir ./obj
    - name: make
      run: CC=clang make && ./testmash
      
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - run: mkdir ./obj
    - name: setup emscripten
      uses: slowriot/setup-emsdk@v15
    - name: make
      run: CC=emcc make
